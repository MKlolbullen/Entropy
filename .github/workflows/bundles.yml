name: Application bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --name lnk-ng lnkup/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: lnk-ng-${{ runner.os }}
          path: dist/lnk-ng/**
      - name: Publish tagged application bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lnk-ng/**
